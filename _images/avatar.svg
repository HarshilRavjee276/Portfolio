<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="avTitle">
  <title id="avTitle">Monogram avatar for Harshil Ravjee</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A3A2A"/>
      <stop offset="1" stop-color="#0E1B15"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <g stroke="#24422F" stroke-width="1">
    <line x1="0" y1="100" x2="400" y2="100"/>
    <line x1="0" y1="300" x2="400" y2="300"/>
    <line x1="100" y1="0" x2="100" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
  </g>
  <text x="200" y="240" text-anchor="middle" font-family="'Space Grotesk', 'Arial', sans-serif" font-size="150" font-weight="600" fill="#E9F3EC">HR</text>
  <text x="200" y="300" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="20" fill="#6FCF97">&lt;/dev&gt;</text>
  <rect x="150" y="255" width="4" height="26" fill="#6FCF97">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
